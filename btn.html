<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            background-color: aqua;

        }
        .btn:hover{
            background-color: grey;
        }
        .box{
            width: 150px;
            height: 100px;
            padding:10px;
            margin: 10px;
            background-color: grey;
            transition: transform 1s;
            justify-content: center;
           
        }
        .box:hover{
            transform: scale(1.5);
            background-color: blue;
        }
        .card{
            width: 300px;
            height: 100px;
            padding: 10px;
            margin: 10px;
            justify-content: center;
            transition-duration: 1s;
            background-color: green;
            box-shadow: 10px;
        }
        .card:hover{
            /* transform: scale(1.1,0); */
            transform: scaleX(1.1);
            background-color: black;
            box-shadow: 0 10px 20px rgba(201, 30, 30, 0.3);

        }
        .opp{
            width: 300px;
            height: 100px;
            padding: 10px;
            text-align: center;
            background-color: aquamarine;
            transition-duration: 0.5s;
        }
        .opp:hover{
            opacity: 0.6;
            transition: opacity 0.5;
        }
    </style>
</head>
<body>
    <button class="btn">hover  me</button>
    <div class="box">
        box
    </div>

    <div class="card">
        card

    </div>

    <div class="opp">
        opacity
    </div>

</body>
</html>
